; PHP-FPM reads .user.ini per directory (user_ini.filename), cached for
; user_ini.cache_ttl — 300s on this host, so edits take up to 5 minutes to apply.
;
; Nothing in front of PHP is compressing HTML on the SPU host: nginx terminates
; TLS, does not gzip, and strips Accept-Encoding before proxying to Apache, so
; mod_deflate cannot fire either. A public page is ~250 KB of HTML that would
; compress to roughly 30 KB.
;
; This directive is inert until nginx is fixed to pass Accept-Encoding through
; (or gzip itself) — see Docs/LEGACY_REDIRECT_MAINTENANCE_GUIDE.md §11. It is
; kept here so the fix is one host-level change away, not a rediscovery.
zlib.output_compression = On
zlib.output_compression_level = 6
