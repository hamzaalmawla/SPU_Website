; PHP-FPM reads .user.ini per directory (user_ini.filename), cached for
; user_ini.cache_ttl — 300s on this host, so edits take up to 5 minutes to apply.
;
; zlib.output_compression WAS set here, and has been removed on purpose.
;
; It never fired: requests advertising `Accept-Encoding: gzip` come back
; uncompressed, so either this file is not honored or the header does not reach
; PHP. Either way it compressed nothing, and it was waiting to become dangerous.
; The application now compresses in CompressPublicResponses, and zlib activating
; underneath it would produce gzip(gzip(body)) under one Content-Encoding header
; — site-wide garbage, triggered not by anything we deploy but by the day the
; host finally answers the compression ticket. Uncorrelated with any change of
; ours, and therefore very hard to diagnose.
;
; One compressor, chosen in one place. If the edge is fixed later, turn the
; application's compression off with COMPRESS_RESPONSES=false and delete the
; middleware — do not re-enable this.
;
; See Docs/PERFORMANCE_MEASUREMENT.md for why compression matters here at all:
; this origin degrades sharply above a ~24 KB response, and gzip is what puts
; every page back under that threshold.
