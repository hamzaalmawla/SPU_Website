<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Femur (thigh bone) -->
  <line x1="30" y1="20" x2="30" y2="65" stroke-width="2.5"/>
  <circle cx="30" cy="18" r="5"/>
  <circle cx="30" cy="68" r="6"/>
  
  <!-- Tibia (shin bone) -->
  <line x1="30" y1="70" x2="30" y2="90" stroke-width="2"/>
  
  <!-- Humerus (upper arm) -->
  <line x1="70" y1="15" x2="70" y2="55" stroke-width="2.5"/>
  <circle cx="70" cy="13" r="5"/>
  <circle cx="70" cy="58" r="5"/>
  
  <!-- Radius (forearm) -->
  <line x1="70" y1="60" x2="70" y2="85" stroke-width="2"/>
  
  <!-- Vertebra representation -->
  <circle cx="50" cy="45" r="6"/>
  <circle cx="50" cy="55" r="5"/>
</svg>