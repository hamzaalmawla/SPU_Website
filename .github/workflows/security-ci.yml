name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  app-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Composer validate
        run: composer validate

      - name: Composer audit
        run: composer audit

      # A blocking check that fails on a registry hiccup teaches people to
      # ignore red, which is how the PHPStan finding above went unnoticed.
      # Retry transport errors; fail immediately on a real advisory.
      - name: NPM audit
        run: |
          for attempt in 1 2 3; do
            if out=$(npm audit --audit-level=high 2>&1); then
              echo "$out"; exit 0
            fi
            echo "$out"
            if echo "$out" | grep -qE "audit endpoint returned an error|ENOTFOUND|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up"; then
              echo "::warning::npm registry error on attempt $attempt/3; retrying"
              sleep $((attempt * 15))
              continue
            fi
            echo "::error::npm audit found advisories at or above 'high'"
            exit 1
          done
          echo "::error::npm registry unreachable after 3 attempts"
          exit 1

      - name: Frontend tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Pint
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Tests
        run: php artisan test
