; PHP settings for the SPU website containers.
; The upload limits match the cPanel vhost (.user.ini, 2026-10-22): the admin
; accepts 10 MB files and Livewire's temporary upload 12 MB.

memory_limit = 512M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
max_input_vars = 5000
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC

; Never on. The application compresses its own responses
; (CompressPublicResponses); PHP's output compression on top of that produces
; gzip(gzip(body)) under one Content-Encoding header - unreadable pages.
zlib.output_compression = Off

session.cookie_httponly = 1
session.use_strict_mode = 1

; The cPanel host had no OPcache, which cost ~175 ms of PHP boot per request.
; The code in the image never changes, so timestamps are not checked.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 0
opcache.jit = off

realpath_cache_size = 4096K
realpath_cache_ttl = 600
