# Reached only through the web container, which forwards /forms, /Medicine and
# /spuh here with the original Host header.
ServerName https://spu.edu.sy
UseCanonicalName Off

<VirtualHost *:80>
    ServerName https://spu.edu.sy
    DocumentRoot /var/www/legacy
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.30.0.0/24
    # Every visitor came over HTTPS; the apps build their links from this.
    SetEnv HTTPS on

    <Directory /var/www/legacy>
        Options -Indexes +FollowSymLinks
        # Each app's own .htaccess (DirectoryIndex index.php, and denies on its
        # uploads, sessions and logs) must keep working exactly as on cPanel.
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
