; Values from the old site's cPanel settings (public_html/.htaccess).
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 16M
post_max_size = 20M
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
zlib.output_compression = Off
; "localhost" means the MariaDB socket shared from the db service.
mysqli.default_socket = /run/mysqld/mysqld.sock
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
