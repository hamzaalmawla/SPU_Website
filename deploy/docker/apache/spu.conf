# Apache inside the web container. Caddy (the proxy service) terminates TLS and
# is the only thing that can reach this port.
#
# The document root's own public/.htaccess does the real work, unchanged from
# cPanel: legacy file continuity under _legacy/, the front controller app.php,
# trailing-slash and forced-HTTPS rules. Keeping Apache (rather than nginx)
# means every old-site rule behaves exactly as it does on the current host.

# The scheme matters: redirects Apache builds itself (the trailing-slash rule,
# /forms -> /forms/) take it from here, and every visitor arrived over HTTPS.
# The host still comes from the request (UseCanonicalName Off).
ServerName https://spu.edu.sy
UseCanonicalName Off
TraceEnable Off
FileETag MTime Size

<IfModule mpm_prefork_module>
    StartServers             4
    MinSpareServers          4
    MaxSpareServers          12
    MaxRequestWorkers        ${APACHE_MAX_WORKERS}
    MaxConnectionsPerChild   2000
</IfModule>

<VirtualHost *:80>
    ServerName https://spu.edu.sy
    DocumentRoot /var/www/spu/public

    # The client address, not Caddy's: Laravel's throttles, the audit log and
    # stats-hit.php's visitor hash all read REMOTE_ADDR. Only the proxy network
    # is trusted to say who the client is.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${SPU_PROXY_SUBNET}

    # Every public request arrives over HTTPS at Caddy. Telling PHP so keeps
    # Laravel's URLs, secure cookies and canonical checks on https without
    # widening the application's trusted-proxy list (bootstrap/app.php).
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/spu/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The old site's media is never code. The .htaccess already refuses these
    # extensions; this makes it true even if that file is changed.
    <Directory /var/www/spu/public/_legacy>
        php_admin_flag engine off
        Options -Indexes -ExecCGI +FollowSymLinks
    </Directory>

    # Written by the entrypoint from SPU_LEGACY_APPS / SPU_LEGACY_MEDIA:
    # where /forms, /Medicine, /spuh and the old media are answered from.
    IncludeOptional /etc/apache2/spu-generated/*.conf

    ErrorLog /proc/self/fd/2
    LogFormat "%a %{Host}i \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\"" spu
    CustomLog /proc/self/fd/1 spu
</VirtualHost>
